apiVersion: apps/v1
kind: Deployment
metadata:
  name: triagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triagent
  template:
    metadata:
      labels:
        app: triagent
    spec:
      containers:
        - name: triagent
          image: triagent:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: triagent-keys
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10