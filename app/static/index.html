<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angie · TriAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@700;800&display=swap">
<style>
  /* Tidewater: calm water blue, coral kept only for emergencies. */
  :root {
    --bg-top: #e8f1f5; --bg: #f5f8f9; --panel: #ffffff; --text: #1b2a33; --muted: #5a6c77;
    --border: #d6e3ea; --accent: #34779a; --accent-text: #ffffff;
    --you: #dcebf2; --you-text: #173341; --tag-bg: #e2f0f6; --tag-text: #245d7a;
    --chip-bg: #e6f2f8; --chip-border: #9cc6dc; --chip-text: #1f5f80;
    --sos-bg: #fff1ec; --sos: #9a3412; --urgent: #c2410c; --urgent-bg: #fff3ef;
    --warn-bg: #fff6e0; --warn: #7a5300;
    --font-display: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-top: #13232c; --bg: #0f1a20; --panel: #182830; --text: #e3edf2; --muted: #9bb0bc;
      --border: #284250; --accent: #6db3d6; --accent-text: #0b1d26;
      --you: #1f3a49; --you-text: #e3edf2; --tag-bg: #1d3542; --tag-text: #9fd0e8;
      --chip-bg: #1b3644; --chip-border: #3d6b82; --chip-text: #a9d6ec;
      --sos-bg: #3a2018; --sos: #ffb59a; --urgent: #f0703f; --urgent-bg: #2e1c16;
      --warn-bg: #3a3020; --warn: #f0c870;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--bg-top) 0, var(--bg) 320px) var(--bg);
    color: var(--text); font: 16px/1.55 var(--font-body);
    display: flex; flex-direction: column;
  }
  header, main, form, .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 900px) {
    header, main, form, .wrap { padding: 0 32px; }
    body { font-size: 17px; }
  }
  header { padding-top: 18px; padding-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .avatar { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-text); font: 800 14px/1 var(--font-display); }
  header .avatar { width: 40px; height: 40px; font-size: 18px; }
  header h1 { font: 800 22px/1.1 var(--font-display); margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  header button { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .sos { padding: 9px 14px; border-radius: 12px; font-size: 14px; background: var(--sos-bg); color: var(--sos); }
  .notice { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; font-size: 14px;
    background: var(--warn-bg); color: var(--warn); }
  main { flex: 1; overflow-y: auto; padding-top: 16px; padding-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row .avatar { visibility: hidden; }
  .row.last .avatar { visibility: visible; }
  .msg { padding: 10px 14px; border-radius: 18px; max-width: min(86%, 46rem); overflow-wrap: anywhere;
    background: var(--panel); border: 1px solid var(--border); }
  .row .msg { border-bottom-left-radius: 6px; }
  .msg.you { background: var(--you); color: var(--you-text); margin: 6px 0 4px auto; border-color: transparent;
    border-bottom-right-radius: 6px; white-space: pre-wrap; }
  .msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; }
  .msg ul, .msg ol { margin: 0 0 6px; padding-left: 20px; }
  .msg ul:last-child, .msg ol:last-child { margin-bottom: 0; }
  .msg a { color: var(--accent); }
  .msg.urgent { background: var(--urgent-bg); border-color: var(--urgent); }
  .msg.urgent::before { content: "Emergency"; display: block; width: fit-content; margin-bottom: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 999px; background: var(--urgent); color: #fff; }
  .msg.error { border-color: var(--warn); color: var(--warn); }
  .fine { margin: 0 0 4px 38px; font-size: 12px; color: var(--muted); max-width: 80%; }
  .typing { color: var(--muted); font-style: italic; font-size: 14px; margin-left: 38px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 6px 38px; }
  .chip { font: inherit; font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--chip-border); background: var(--chip-bg); color: var(--chip-text); }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .chip[aria-pressed="true"]::before { content: "✓ "; }
  .chip.done { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
  .chip:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  form { display: flex; gap: 8px; padding-top: 8px; padding-bottom: 12px; }
  textarea { flex: 1; resize: none; min-height: 50px; max-height: 160px; padding: 13px 14px;
    border-radius: 18px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); font: inherit; }
  form button { border: 0; border-radius: 18px; padding: 0 20px; font: inherit; font-weight: 700;
    background: var(--accent); color: var(--accent-text); cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 12px; }
  @media (prefers-reduced-motion: no-preference) {
    .row, .chips, .fine { animation: rise .25s ease-out both; }
    @keyframes rise { from { opacity: .2; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<header>
  <div class="avatar" aria-hidden="true">A</div>
  <div>
    <h1>Angie</h1>
    <p>Your care guide · TriAgent</p>
  </div>
  <button type="button" id="restart">New chat</button>
</header>
<div class="wrap">
  <div class="sos" role="note">Chest pain, trouble breathing or heavy bleeding? <strong>Call 911 now.</strong></div>
  <div class="notice" id="fake" hidden>Test mode: no Google Maps key is set, so the places shown are made up.</div>
</div>
<main id="log" aria-live="polite"></main>
<form id="form">
  <textarea id="input" placeholder="Tell Angie what's going on…" aria-label="Your message" required></textarea>
  <button id="send">Send</button>
</form>
<footer>Angie offers suggestions, not a diagnosis or medical advice. In an emergency, call 911.</footer>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const DISCLAIMER = /^Angie offers suggestions about where to seek care/i;
const GREETING = [
  "**Hi, I'm Angie.** I help you figure out where to go for care, from home remedies to urgent care or the ER.",
  "What's going on? Tell me in your own words, or tap one of these.",
];
const STARTERS = ["I have a rash or hives", "My child has a fever", "I hurt myself", "Something feels urgent"];
let session = null;
let busy = false;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Small Markdown subset: paragraphs, bullet and numbered lists, **bold**, *italic*, links.
function inline(s) {
  return escapeHtml(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function render(md) {
  const out = [];
  let list = null;
  for (const raw of md.split("\n")) {
    const line = raw.trim();
    const bullet = line.match(/^[-*•]\s+(.*)/), num = line.match(/^\d+[.)]\s+(.*)/);
    const kind = bullet ? "ul" : num ? "ol" : null;
    if (kind) {
      if (list !== kind) { if (list) out.push(`</${list}>`); out.push(`<${kind}>`); list = kind; }
      out.push(`<li>${inline((bullet || num)[1])}</li>`);
      continue;
    }
    if (list) { out.push(`</${list}>`); list = null; }
    if (line) out.push(`<p>${inline(line.replace(/^#+\s*/, ""))}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join("");
}

// Split a reply into separate texts at blank lines. A line ending in ":" stays
// with the list under it, so "Next steps:" and its items arrive together.
function parts(text) {
  const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const merged = [];
  for (const b of blocks) {
    const prev = merged[merged.length - 1];
    if (prev && /:$/.test(prev) && /^([-*•]|\d+[.)])\s/.test(b)) merged[merged.length - 1] = prev + "\n" + b;
    else merged.push(b);
  }
  return merged;
}

function scrollDown() { log.scrollTop = log.scrollHeight; }

function addYou(text) {
  const div = document.createElement("div");
  div.className = "msg you";
  div.textContent = text;
  log.appendChild(div);
  scrollDown();
}

function addAngie(text, extraClass = "") {
  // Only the last text in a run of Angie's texts shows Angie's avatar.
  const prev = log.lastElementChild;
  if (prev && prev.classList.contains("row")) prev.classList.remove("last");
  const row = document.createElement("div");
  row.className = "row last";
  row.innerHTML = '<div class="avatar" aria-hidden="true">A</div>';
  const div = document.createElement("div");
  div.className = ("msg " + extraClass).trim();
  div.innerHTML = render(text);
  row.appendChild(div);
  log.appendChild(row);
  scrollDown();
}

function addFine(text) {
  const p = document.createElement("p");
  p.className = "fine";
  p.textContent = text;
  log.appendChild(p);
  scrollDown();
}

function addError(text) {
  const div = document.createElement("div");
  div.className = "msg error";
  div.textContent = text;
  log.appendChild(div);
  scrollDown();
}

const pause = ms => new Promise(r => setTimeout(r, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : ms));

const squash = s => s.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

// Show Angie's reply one short text at a time. When chips come with it, make sure
// their question is shown too: if the reply text doesn't already ask it, it goes in
// as its own text just before the small print.
async function showReply(text, choices) {
  const list = parts(text);
  const question = (choices && choices.question) || "";
  if (choices) {
    if (question && !squash(text).includes(squash(question))) {
      const at = list.findIndex(p => DISCLAIMER.test(p));
      list.splice(at === -1 ? list.length : at, 0, question);
    } else if (!list.some(p => !DISCLAIMER.test(p))) {
      list.unshift("Which of these fits best?");
    }
  }
  for (let i = 0; i < list.length; i++) {
    const part = list[i];
    if (DISCLAIMER.test(part)) { addFine(part); continue; }
    const urgent = i === 0 && /call 911|local emergency number/i.test(part);
    if (i > 0) await pause(450);
    addAngie(part, urgent ? "urgent" : "");
  }
}

function clearChips() {
  log.querySelectorAll(".chips").forEach(c => c.querySelectorAll("button").forEach(b => { b.disabled = true; }));
}

// Tappable answers. A single-choice chip sends at once; anything already typed in
// the box goes along with it. Multiple-choice chips toggle, then "Send" sends them.
function addChips(options, multiple) {
  const box = document.createElement("div");
  box.className = "chips";
  box.setAttribute("role", "group");
  box.setAttribute("aria-label", "Suggested answers");
  const picked = new Set();
  let done = null;
  for (const option of options) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = option;
    if (multiple) b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      if (!multiple) return submit(option, true);
      if (picked.has(option)) picked.delete(option); else picked.add(option);
      b.setAttribute("aria-pressed", String(picked.has(option)));
      done.disabled = picked.size === 0;
    });
    box.appendChild(b);
  }
  if (multiple) {
    done = document.createElement("button");
    done.type = "button";
    done.className = "chip done";
    done.textContent = "Send";
    done.disabled = true;
    done.addEventListener("click", () => submit([...picked].join(", "), true));
    box.appendChild(done);
  }
  log.appendChild(box);
  scrollDown();
}

async function newSession() {
  const r = await fetch("/api/new", {method: "POST"});
  session = (await r.json()).session;
}

async function submit(text, fromChip = false) {
  if (busy) return;
  const typed = input.value.trim();
  if (fromChip && typed) text = typed + ", " + text;
  text = text.trim();
  if (!text) return;
  busy = true;
  send.disabled = true;
  clearChips();
  addYou(text);
  input.value = "";
  const typing = document.createElement("p");
  typing.className = "typing";
  typing.textContent = "Angie is typing…";
  log.appendChild(typing);
  scrollDown();
  try {
    if (!session) await newSession();
    const r = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session, message: text}),
    });
    const data = await r.json();
    typing.remove();
    if (data.error) addError(data.error);
    else {
      const choices = data.choices && data.choices.options && data.choices.options.length ? data.choices : null;
      await showReply(data.reply || "", choices);
      if (choices) {
        await pause(250);
        addChips(data.choices.options, data.choices.multiple);
      }
    }
  } catch (err) {
    typing.remove();
    addError("Couldn't reach Angie. Is the TriAgent server still running?");
  } finally {
    busy = false;
    send.disabled = false;
    input.focus();
  }
}

function greet() {
  log.innerHTML = "";
  GREETING.forEach(g => addAngie(g));
  addChips(STARTERS, false);
}

form.addEventListener("submit", (e) => { e.preventDefault(); submit(input.value); });

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

document.getElementById("restart").addEventListener("click", () => {
  if (busy) return;
  session = null;
  greet();
  input.focus();
});

fetch("/api/config").then(r => r.json()).then(c => {
  document.getElementById("fake").hidden = !c.fake_clinics;
}).catch(() => {});
greet();
input.focus();
</script>
</body>
</html>
